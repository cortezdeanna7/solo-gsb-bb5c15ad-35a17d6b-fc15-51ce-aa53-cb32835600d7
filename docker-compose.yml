services:
  family-tree:
    build: .
    image: family-tree-checker:latest
    container_name: family-tree-checker
    restart: unless-stopped
    ports:
      # 宿主机端口:容器端口 —— 修改左侧端口即可更换访问端口
      - "${HOST_PORT:-3000}:3000"
    environment:
      # 容器内监听端口（与右侧端口映射保持一致，一般无需修改）
      PORT: "3000"
      DATA_FILE: /app/data/family.json
    volumes:
      # 家谱数据持久化到宿主机，重建/升级容器不丢数据
      - family-data:/app/data

volumes:
  family-data:
